name: Bug report
description: Report a reproducible YFPhoneCam problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste unredacted device serials, tokens, or personal paths.
  - type: input
    id: version
    attributes:
      label: YFPhoneCam version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 10 x64, Windows 11 x64]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the target camera application and phone/Android version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Attach the ZIP created through File > Export diagnostics if appropriate.
