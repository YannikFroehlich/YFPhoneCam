name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy yfphonecam
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: JavaScript syntax
        run: |
          node --check yfphonecam/web/phone/phone.js
          node --check yfphonecam/web/status/status.js

  tag-release:
    name: Tag release on main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Determine version tag
        id: version
        shell: pwsh
        run: |
          $version = python -c "from yfphonecam.version import __version__; print(__version__)"
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Create and push tag if new
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Host "Tag $tag already exists on origin; skipping. Bump yfphonecam/version.py to release."
            "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
            Write-Host "Pushed tag $tag."
            "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Trigger release workflow
        if: steps.tag.outputs.created == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag pushed with GITHUB_TOKEN does not itself trigger other workflows,
          # so dispatch the Release workflow explicitly for the new tag.
          gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f tag="${{ steps.version.outputs.tag }}"
          Write-Host "Dispatched Release workflow for ${{ steps.version.outputs.tag }}."
