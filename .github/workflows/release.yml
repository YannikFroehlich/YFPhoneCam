name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify source version
        run: python scripts/check_version.py "${{ github.ref_name }}"
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/install_inno_setup.ps1
      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build_release.ps1 -Tag "${{ github.ref_name }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YFPhoneCam-${{ github.ref_name }}
          path: installer/output/*
          if-no-files-found: error
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "installer/output/YFPhoneCam-Setup-$version.exe" `
            "installer/output/YFPhoneCam-Setup-$version.exe.sha256" `
            "installer/output/YFPhoneCam-$version.cdx.json" `
            --draft --generate-notes --title "YFPhoneCam $version"
