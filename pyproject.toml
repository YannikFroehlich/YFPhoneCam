[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yfphonecam"
dynamic = ["version"]
description = "Use an Android phone as a low-latency USB webcam on Windows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Yannik Froehlich" }]
keywords = ["android", "webcam", "adb", "virtual-camera", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pip-tools>=7.4,<8",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
yfphonecam = "yfphonecam.__main__:main"

[project.urls]
Homepage = "https://github.com/YannikFroehlich/YFPhoneCam"
Issues = "https://github.com/YannikFroehlich/YFPhoneCam/issues"
Releases = "https://github.com/YannikFroehlich/YFPhoneCam/releases"

[tool.setuptools.dynamic]
version = { attr = "yfphonecam.version.__version__" }

[tool.setuptools.packages.find]
include = ["yfphonecam*"]

[tool.setuptools.package-data]
yfphonecam = ["web/**/*.html", "web/**/*.css", "web/**/*.js", "assets/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

